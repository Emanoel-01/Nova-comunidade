<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Emanoel Amorim</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f8fafc;
      color: #132A41;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      padding: 48px 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px -2px rgba(19, 42, 65, 0.06), 0 2px 6px -1px rgba(19, 42, 65, 0.04);
      border: 1px solid #e2e8f0;
    }
    .code {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      color: #132A41;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #132A41;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #475569;
      margin-bottom: 32px;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .nav-links a {
      display: inline-flex;
      align-items: center;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.2s, color 0.2s;
    }
    .nav-links a.primary {
      background-color: #132A41;
      color: #ffffff;
    }
    .nav-links a.primary:hover {
      background-color: #0d1e2f;
    }
    .nav-links a.secondary {
      background-color: #f1f5f9;
      color: #132A41;
      border: 1px solid #e2e8f0;
    }
    .nav-links a.secondary:hover {
      background-color: #e2e8f0;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou acessar não existe, foi movido ou está temporariamente indisponível.</p>
    <nav class="nav-links" aria-label="Navegação de retorno">
      <a href="/" class="primary">Início</a>
      <a href="/blog/" class="secondary">Blog</a>
      <a href="/contato/" class="secondary">Contato</a>
    </nav>
  </main>
</body>
</html>
